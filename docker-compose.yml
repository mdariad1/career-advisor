version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: career_db
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - nlp_service
    networks:
      - internal
      - external

  nlp_service:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
    networks:
      - internal

  job_sync:
    build:
      context: ./job_sync
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
      - nlp_service
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - external

volumes:
  mongo_data:

networks:
  internal:
  external:
