version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data_dev:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: career_db
    ports:
      - "27017:27017"
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - nlp_service
    networks:
      - internal

  nlp_service:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./nlp_service:/app
    ports:
      - "8001:8001"
    depends_on:
      - mongo
    networks:
      - internal

  job_sync:
    build:
      context: ./job_sync
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./job_sync:/app
    depends_on:
      - mongo
      - nlp_service
    networks:
      - internal

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  mongo_data_dev:

networks:
  internal:
    driver: bridge
